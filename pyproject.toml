[project]
name = "pikvm-homeassistant-integration"
version = "1.2.1"
description = "PiKVM Home Assistant Custom Integration"
readme = "README.md"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["custom_components/pikvm"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
